<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jess Music Studio 管理系統</title>
  <style>
    body { 
      font-family: "Helvetica Neue", Arial, sans-serif; 
      text-align: center; 
      padding: 20px; 
      background-color: #FDFBF7; 
      color: #4A4A4A;
    }
    h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; }
    p { font-size: 14px; color: #888; margin-bottom: 30px; }
    
    .button {
      display: block; width: 90%; padding: 15px; margin: 15px auto;
      background-color: #8C9C8A; color: white; text-decoration: none;
      border-radius: 8px; font-size: 16px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btn-secondary { background-color: #D3D3D3; color: #333; }
    
    .student-card {
      background-color: white; padding: 15px; margin: 10px auto; width: 90%;
      border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left;
    }
    .student-name { font-size: 18px; font-weight: bold; margin-bottom: 12px; color: #333; }
    
    .status-options { display: flex; justify-content: space-between; }
    .status-options label { font-size: 16px; padding: 5px; }

    /* 管理名單專用的輸入框與小按鈕 */
    .input-box { width: 60%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px;}
    .add-btn { padding: 10px 15px; background-color: #8C9C8A; color: white; border: none; border-radius: 5px; font-size: 16px;}
    .small-btn { padding: 5px 10px; border: none; border-radius: 5px; font-size: 14px; margin-left: 5px; }
    .edit-btn { background-color: #E2E8DF; color: #333; }
    .del-btn { background-color: #FFB6B9; color: white; }
  </style>
</head>
<body>
  
  <!-- 第一頁：主選單 -->
  <div id="main-menu">
    <h1>Jess Music Studio</h1>
    <p>工作室管理系統</p>
    <button class="button" onclick="showPage('attendance-page')">📝 學生點名與排課</button>
    <button class="button" onclick="showPage('manage-page')">⚙️ 學生名單管理</button>
    <button class="button" onclick="calculateFee()">💰 師資鐘點費計算</button>
  </div>

  <!-- 第二頁：點名畫面 -->
  <div id="attendance-page" style="display: none;">
    <h2 style="font-weight: 300;">📝 今日點名總表</h2>
    
    <!-- 這裡原本寫死的卡片清空了，交給 JavaScript 自動生成 -->
    <div id="attendance-list"></div>

    <button class="button" onclick="saveAttendance()">✅ 儲存今日點名</button>
    <button class="button btn-secondary" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <!-- 第三頁：學生名單管理畫面 -->
  <div id="manage-page" style="display: none;">
    <h2 style="font-weight: 300;">⚙️ 學生名單管理</h2>
    
    <div style="margin-bottom: 20px;">
      <input type="text" id="new-student-name" class="input-box" placeholder="例如: 王大花 (鋼琴)">
      <button class="add-btn" onclick="addStudent()">新增</button>
    </div>

    <!-- 這裡會列出所有學生讓你修改或刪除 -->
    <div id="manage-list"></div>

    <button class="button btn-secondary" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <script>
    // 1. 從手機瀏覽器記憶中讀取名單，如果沒有，就給兩個預設範例
    let students = JSON.parse(localStorage.getItem('jess_students')) || ['陳小明 (鋼琴)', '林小華 (小提琴)'];

    // 2. 切換畫面的功能 (同時自動更新名單畫面)
    function showPage(pageId) {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('attendance-page').style.display = 'none';
      document.getElementById('manage-page').style.display = 'none';
      
      // 如果切換到點名或管理頁面，先重新繪製最新的名單
      if(pageId === 'attendance-page') renderAttendanceList();
      if(pageId === 'manage-page') renderManageList();
      
      document.getElementById(pageId).style.display = 'block';
    }

    // 3. 畫出點名總表
    function renderAttendanceList() {
      let listHTML = '';
      for (let i = 0; i < students.length; i++) {
        listHTML += `
          <div class="student-card">
            <div class="student-name">${students[i]}</div>
            <div class="status-options">
              <label><input type="radio" name="student_${i}" value="出席"> 出席</label>
              <label><input type="radio" name="student_${i}" value="延期"> 延期</label>
              <label><input type="radio" name="student_${i}" value="補課"> 補課</label>
            </div>
          </div>`;
      }
      document.getElementById('attendance-list').innerHTML = listHTML;
    }

    // 4. 畫出管理名單 (包含修改與刪除按鈕)
    function renderManageList() {
      let listHTML = '';
      for (let i = 0; i < students.length; i++) {
        listHTML += `
          <div class="student-card" style="display: flex; justify-content: space-between; align-items: center;">
            <div class="student-name" style="margin: 0; font-size: 16px;">${students[i]}</div>
            <div>
              <button class="small-btn edit-btn" onclick="editStudent(${i})">修改</button>
              <button class="small-btn del-btn" onclick="deleteStudent(${i})">刪除</button>
            </div>
          </div>`;
      }
      document.getElementById('manage-list').innerHTML = listHTML;
    }

    // 5. 新增學生
    function addStudent() {
      let nameInput = document.getElementById('new-student-name');
      let name = nameInput.value.trim(); // 抓取輸入的字，並去掉前後空白
      if (name !== '') {
        students.push(name); // 把名字加進清單
        saveToMemory();      // 存進記憶體
        nameInput.value = '';// 清空輸入框
        renderManageList();  // 重新顯示名單
      }
    }

    // 6. 刪除學生
    function deleteStudent(index) {
      if (confirm("確定要刪除這位學生嗎？")) {
        students.splice(index, 1); // 刪除該名學生
        saveToMemory();
        renderManageList();
      }
    }

    // 7. 修改學生
    function editStudent(index) {
      let newName = prompt("請輸入修改後的名字：", students[index]);
      if (newName !== null && newName.trim() !== '') {
        students[index] = newName.trim();
        saveToMemory();
        renderManageList();
      }
    }

    // 8. 把名單存進手機瀏覽器的記憶體
    function saveToMemory() {
      localStorage.setItem('jess_students', JSON.stringify(students));
    }

    // 9. 儲存點名 (目前先維持跳出提示)
    function saveAttendance() {
      alert("太棒了！今日點名已經暫時紀錄。");
      showPage('main-menu');
    }

    // 10. 鐘點費計算
    function calculateFee() {
      let tuition = Number(prompt("請輸入學生的單堂學費（例如：1000）："));
      if (tuition > 0) {
        alert("✅ 結算完成！\n\n給授課老師：" + (tuition * 0.7) + " 元\n工作室營收：" + (tuition * 0.3) + " 元");
      }
    }
  </script>
</body>
</html>
