<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jess Music Studio 管理系統</title>
  
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
  
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 15px; background-color: #FDFBF7; color: #4A4A4A; }
    h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; }
    p { font-size: 14px; color: #888; margin-bottom: 30px; }
    
    .button { display: block; width: 90%; padding: 15px; margin: 15px auto; background-color: #8C9C8A; color: white; text-decoration: none; border-radius: 8px; font-size: 16px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn-secondary { background-color: #D3D3D3; color: #333; }
    .small-btn { padding: 5px 10px; border: none; border-radius: 5px; font-size: 14px; margin-left: 5px; cursor: pointer; }
    .del-btn { background-color: #FFB6B9; color: white; }
    .action-btn { background-color: #A3B19B; color: white; margin-top: 10px; width: 100%; padding: 8px; border-radius: 5px; border: none; }
    .reset-btn { background-color: #E2E8DF; color: #333; width: 100%; padding: 10px; margin-top: 15px; border-radius: 5px; border: none; }
    
    .card { background-color: white; padding: 15px; margin: 10px auto; width: 90%; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; }
    .makeup-card { border-left: 4px solid #E08E79; } 
    .history-card { border-left: 4px solid #ccc; opacity: 0.7; }
    
    .student-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #333; }
    .student-detail { font-size: 13px; color: #666; margin-bottom: 12px; }
    .status-options { display: flex; justify-content: space-between; }
    
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
    .form-control, .form-select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; background-color: white;} 
    .radio-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; align-items: center; }
    .time-select-group { display: flex; gap: 10px; }

    #calendar { margin-top: 15px; font-size: 14px; background-color: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .fc-toolbar-title { font-size: 18px !important; color: #4A4A4A; }
    .fc-button { background-color: #8C9C8A !important; border: none !important; }
    .fc-event { border: none !important; padding: 3px 5px; border-radius: 4px; font-size: 12px; margin-bottom: 2px; }
    .event-piano { background-color: #8C9C8A !important; }
    .event-violin { background-color: #B5A886 !important; }
    .event-other { background-color: #A39193 !important; }
    .event-makeup { background-color: #E08E79 !important; color: white !important; } 
    
    .money-box { background-color: white; border-left: 5px solid #8C9C8A; padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left;}
    .money-title { font-size: 14px; color: #666; margin-bottom: 5px; }
    .money-amount { font-size: 28px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  
  <div id="main-menu">
    <h1>Jess Music Studio</h1>
    <p>工作室管理系統</p>
    <button class="button" onclick="showPage('calendar-page')">📅 月曆課表總覽</button>
    <button class="button" onclick="showPage('attendance-page')">📝 今日點名總表</button>
    <button class="button" onclick="showPage('makeup-page')">🔄 補課存摺管理</button>
    <button class="button" onclick="showPage('manage-page')">⚙️ 學生名單管理</button>
    <button class="button" onclick="showPage('salary-page')">💰 本月上課費用統計</button>
  </div>

  <div id="calendar-page" style="display: none;">
    <h2 style="font-weight: 300;">📅 月曆課表總覽</h2>
    <div id="calendar"></div>
    <button class="button btn-secondary" style="margin-top: 20px;" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <div id="attendance-page" style="display: none;">
    <h2 id="attendance-title" style="font-weight: 300; font-size: 20px;">📝 今日點名總表</h2>
    <p id="attendance-date" style="margin-top: -10px; margin-bottom: 20px;"></p>
    <div id="attendance-list"></div>
    <button class="button" onclick="saveAttendance()">✅ 儲存今日點名</button>
    <button class="button btn-secondary" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <div id="makeup-page" style="display: none;">
    <h2 style="font-weight: 300;">🔄 補課存摺管理</h2>
    
    <div class="card" style="background-color: #FFF9F5; border: 1px solid #E08E79;">
      <h3 style="margin-top:0; font-size: 16px; color:#E08E79;">➕ 手動新增 (先補課/請假)</h3>
      <div class="form-group">
        <select id="manual-makeup-student" class="form-select">
          <option value="" disabled selected>選擇學生</option>
        </select>
      </div>
      <button class="button" style="width:100%; margin:0; background-color:#E08E79;" onclick="addManualMakeup()">新增 1 堂需補課紀錄</button>
    </div>

    <h3 style="font-size: 16px; text-align: left; padding-left: 20px; margin-top: 20px;">📝 待處理補課</h3>
    <div id="makeup-active-list"></div>

    <button class="reset-btn" id="toggle-history-btn" onclick="toggleHistory()" style="width: 90%; margin: 20px auto; display: block;">👁️ 顯示已完成的歷史紀錄</button>
    <div id="makeup-history-list" style="display: none;"></div>

    <button class="button btn-secondary" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <div id="manage-page" style="display: none;">
    <h2 style="font-weight: 300;">⚙️ 學生名單管理</h2>
    <div class="card" style="background-color: #F4F6F3; border: 1px solid #8C9C8A;">
      <h3 style="margin-top:0; font-size: 16px;">➕ 新增學生資料</h3>
      <div class="form-group"><label>學生姓名</label><input type="text" id="add-name" class="form-control" placeholder="例如：王大花"></div>
      <div class="form-group"><label>學習樂器</label><div class="radio-group"><label><input type="radio" name="add-instrument" value="鋼琴" onclick="checkInstrument()" checked> 鋼琴</label><label><input type="radio" name="add-instrument" value="小提琴" onclick="checkInstrument()"> 小提琴</label><label><input type="radio" name="add-instrument" value="其他" onclick="checkInstrument()"> 其他</label><input type="text" id="other-instrument" class="form-control" style="display: none; width: auto; flex-grow: 1; padding: 5px;" placeholder="請輸入樂器"></div></div>
      <div class="form-group"><label>上課時間 (必填)</label><div class="time-select-group"><select id="add-day" class="form-select"><option value="" disabled selected>選擇星期</option><option value="1">週一</option><option value="2">週二</option><option value="3">週三</option><option value="4">週四</option><option value="5">週五</option><option value="6">週六</option><option value="0">週日</option></select><input type="time" id="add-time" class="form-control"></div></div>
      <div class="form-group"><label>單堂學費 (元)</label><input type="number" id="add-fee" class="form-control" placeholder="例如：1000"></div>
      <div class="form-group"><label>聯絡電話</label><input type="tel" id="add-phone" class="form-control" placeholder="家長或學生電話"></div>
      <button class="button" style="width:100%; margin:0;" onclick="addStudent()">確認新增</button>
    </div>
    <div id="manage-list"></div>
    <button class="button btn-secondary" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <div id="salary-page" style="display: none;">
    <h2 style="font-weight: 300;">💰 上課費用統計</h2>
    <div style="width: 90%; margin: 0 auto;">
      <div class="money-box">
        <div class="money-title">本月已上課學費總額</div>
        <div class="money-amount" id="total-revenue">NT$ 0</div>
      </div>
      <button class="reset-btn" onclick="resetSalary()">⚠️ 結算並清空歸零 (下個月重新計算)</button>
    </div>
    <button class="button btn-secondary" style="margin-top: 20px;" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <script>
    let students = JSON.parse(localStorage.getItem('jess_students_v3')) || [];
    let financeData = JSON.parse(localStorage.getItem('jess_finance_v2')) || { totalRevenue: 0 };
    let makeupBank = JSON.parse(localStorage.getItem('jess_makeup_v1')) || [];
    let calendar; 

    function formatDate(dateObj) {
      let y = dateObj.getFullYear();
      let m = String(dateObj.getMonth() + 1).padStart(2, '0');
      let d = String(dateObj.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }
    
    function getDayName(index) {
      const days = {'0':'週日', '1':'週一', '2':'週二', '3':'週三', '4':'週四', '5':'週五', '6':'週六'};
      return days[index] || '';
    }

    // 格式化時間為 24 小時制 (例如: "09:30" 或 "18:00")，用於顯示
    function formatTime24h(timeStr) {
      if (!timeStr) return '';
      // HTML input type="time" 回傳的值通常已經是 "HH:mm" 格式 (24小時制)
      // 例如 "09:00", "14:30"。我們只需要確保顯示出來的字串不要被轉換。
      return timeStr; 
    }

    function generateId() { return Math.random().toString(36).substr(2, 9); }

    function showPage(pageId) {
      const pages = ['main-menu', 'calendar-page', 'attendance-page', 'manage-page', 'salary-page', 'makeup-page'];
      pages.forEach(p => document.getElementById(p).style.display = 'none');
      
      if(pageId === 'attendance-page') renderAttendanceList();
      if(pageId === 'manage-page') renderManageList();
      if(pageId === 'salary-page') renderSalaryPage(); 
      if(pageId === 'makeup-page') { populateMakeupStudentSelect(); renderMakeupList(); }
      
      document.getElementById(pageId).style.display = 'block';
      
      if(pageId === 'calendar-page') { renderCalendar(); }
    }

    function renderCalendar() {
      if (!calendar) {
        let calendarEl = document.getElementById('calendar');
        calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth', locale: 'zh-tw',
          headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
          height: 'auto', displayEventTime: true,
          // 強制 FullCalendar 使用 24 小時制顯示時間 (例如 18:30 而不是 6:30 PM)
          eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          },
          events: function(info, successCallback, failureCallback) {
            let events = [];
            let d = new Date(info.start.valueOf());
            
            while(d < info.end) {
              let dayOfWeek = d.getDay().toString();
              let dateStr = formatDate(d);

              students.forEach(s => {
                if (s.dayIndex === dayOfWeek) {
                  let canceled = s.canceledDates || [];
                  let makeupConverted = s.makeupConvertedDates || [];
                  
                  if (canceled.includes(dateStr)) return; 
                  if (makeupConverted.includes(dateStr)) return; 

                  let eventClass = s.instrument === '鋼琴' ? 'event-piano' : (s.instrument === '小提琴' ? 'event-violin' : 'event-other');
                  let eventObj = { title: s.name + ' (' + s.instrument + ')', className: eventClass, start: dateStr + (s.timeVal ? 'T' + s.timeVal : '') };
                  if (!s.timeVal) eventObj.allDay = true;
                  events.push(eventObj);
                }
              });

              makeupBank.forEach(record => {
                if(record.status === 'active') {
                  record.schedules.forEach(sch => {
                    if (sch.date === dateStr && !sch.attended) {
                      events.push({
                        title: '[補課] ' + record.studentName + ' (' + sch.amount + '堂)',
                        className: 'event-makeup',
                        start: dateStr + (sch.time ? 'T' + sch.time : '')
                      });
                    }
                  });
                }
              });

              d.setDate(d.getDate() + 1);
            }
            successCallback(events);
          }
        });
        calendar.render();
      } else {
        calendar.refetchEvents();
      }
      setTimeout(() => { calendar.updateSize(); }, 100);
    }

    function renderAttendanceList() {
      let listHTML = '';
      let now = new Date();
      let todayStr = formatDate(now);
      let year = now.getFullYear();
      let month = now.getMonth() + 1; 
      let date = now.getDate();
      let todayIndex = now.getDay().toString(); 
      let countToday = 0;
      
      document.getElementById('attendance-date').innerText = year + '年' + month + '月' + date + '日 (' + getDayName(todayIndex) + ')';

      for (let i = 0; i < students.length; i++) {
        let s = students[i];
        if (s.dayIndex === todayIndex) {
          
          let canceled = s.canceledDates || [];
          let makeupConverted = s.makeupConvertedDates || [];

          if (canceled.includes(todayStr) || makeupConverted.includes(todayStr)) {
            continue;
          }
          
          countToday++;
          let displayTime = getDayName(s.dayIndex) + ' ' + formatTime24h(s.timeVal);
          listHTML += `
            <div class="card">
              <div class="student-title">${s.name} <span style="font-size:12px; font-weight:normal; color:#888;">[常態課]</span></div>
              <div class="student-detail">🕒 ${displayTime} | 💰 單堂學費: ${s.fee}元</div>
              <div class="status-options">
                <label><input type="radio" name="normal_stu_${i}" value="出席"> 出席</label>
                <label><input type="radio" name="normal_stu_${i}" value="延期"> 延期</label>
                <label><input type="radio" name="normal_stu_${i}" value="補課"> 轉為補課</label>
              </div>
            </div>`;
        }
      }

      makeupBank.forEach(record => {
        if (record.status === 'active') {
          record.schedules.forEach((sch, schIdx) => {
            if (sch.date === todayStr && !sch.attended) {
              countToday++;
              let stuData = students.find(s => s.name === record.studentName);
              let feeText = stuData ? (Number(stuData.fee) * sch.amount) + '元' : '未知';

              listHTML += `
                <div class="card makeup-card">
                  <div class="student-title" style="color:#E08E79;">${record.studentName} <span style="font-size:12px; font-weight:normal;">[今日來補課]</span></div>
                  <div class="student-detail">🕒 ${formatTime24h(sch.time) || '未定'} | 補 ${sch.amount} 堂 | 💰 本次費用: ${feeText}</div>
                  <div class="status-options" style="justify-content: flex-start; gap: 20px;">
                    <label><input type="radio" name="makeup_rec_${record.id}_${schIdx}" value="出席"> ✅ 確認出席</label>
                    <label><input type="radio" name="makeup_rec_${record.id}_${schIdx}" value="延期"> ❌ 取消(退回)</label>
                  </div>
                </div>`;
            }
          });
        }
      });

      if (countToday === 0) {
        listHTML = `<p style="padding: 20px;">太棒了！今天沒有常態排課，也沒有人來補課，好好休息吧！</p>`;
      }

      document.getElementById('attendance-list').innerHTML = listHTML;
    }

    function saveAttendance() {
      let addedRevenue = 0;
      let countAttended = 0;
      let msg = "✅ 今日點名儲存完畢！\n";
      let todayStr = formatDate(new Date()); 

      for (let i = 0; i < students.length; i++) {
        let radios = document.getElementsByName('normal_stu_' + i);
        if(radios.length === 0) continue;

        let status = '';
        for(let j=0; j<radios.length; j++) {
          if(radios[j].checked) status = radios[j].value;
        }

        if (!students[i].canceledDates) students[i].canceledDates = [];
        if (!students[i].makeupConvertedDates) students[i].makeupConvertedDates = [];

        if (status === '出席') {
          let fee = Number(students[i].fee);
          if (fee > 0) { addedRevenue += fee; countAttended++; }
        } else if (status === '延期') {
          if (!students[i].canceledDates.includes(todayStr)) {
            students[i].canceledDates.push(todayStr);
            msg += `\n- ${students[i].name} 已延期 (日曆移除)`;
          }
        } else if (status === '補課') {
          if (!students[i].makeupConvertedDates.includes(todayStr)) {
            students[i].makeupConvertedDates.push(todayStr);
            makeupBank.push({
              id: generateId(),
              studentName: students[i].name,
              dateGen: todayStr,
              totalOwed: 1,
              remaining: 1,
              status: 'active',
              schedules: []
            });
            msg += `\n- ${students[i].name} 轉為需補課 (已存入存摺)`;
          }
        }
        for(let j=0; j<radios.length; j++) radios[j].checked = false;
      }

      makeupBank.forEach(record => {
        if(record.status !== 'active') return;
        
        record.schedules.forEach((sch, schIdx) => {
          if (sch.date === todayStr && !sch.attended) {
            let radios = document.getElementsByName(`makeup_rec_${record.id}_${schIdx}`);
            if(radios.length === 0) return;
            
            let status = '';
            for(let j=0; j<radios.length; j++) { if(radios[j].checked) status = radios[j].value; }

            if (status === '出席') {
              sch.attended = true;
              let stuData = students.find(s => s.name === record.studentName);
              if (stuData && Number(stuData.fee) > 0) {
                let partialFee = Number(stuData.fee) * sch.amount;
                addedRevenue += partialFee;
                countAttended++;
                msg += `\n- [補] ${record.studentName} 出席，費用 +$${partialFee}`;
              }
              
              if (record.remaining === 0) {
                let allAttended = record.schedules.every(s => s.attended);
                if (allAttended) record.status = 'history';
              }

            } else if (status === '延期') {
              record.remaining += sch.amount;
              record.schedules.splice(schIdx, 1); 
              msg += `\n- [補] ${record.studentName} 取消，時數已退回存摺`;
            }
            
            for(let j=0; j<radios.length; j++) radios[j].checked = false;
          }
        });
      });

      if (countAttended > 0) { financeData.totalRevenue += addedRevenue; }
      
      saveToMemory();
      saveFinanceToMemory();
      saveMakeupToMemory();

      if(addedRevenue > 0) msg += `\n\n💰 本次總計產生費用：$${addedRevenue}`;
      if(countAttended === 0 && !msg.includes('-')) msg = "目前沒有勾選任何狀態喔！";
      
      alert(msg);
      showPage('main-menu');
    }

    function populateMakeupStudentSelect() {
      let select = document.getElementById('manual-makeup-student');
      select.innerHTML = '<option value="" disabled selected>選擇學生</option>';
      students.forEach(s => {
        select.innerHTML += `<option value="${s.name}">${s.name}</option>`;
      });
    }

    function addManualMakeup() {
      let select = document.getElementById('manual-makeup-student');
      let studentName = select.value;
      if (!studentName) { alert('請先選擇學生！'); return; }
      
      makeupBank.push({
        id: generateId(),
        studentName: studentName,
        dateGen: formatDate(new Date()),
        totalOwed: 1,
        remaining: 1,
        status: 'active',
        schedules: []
      });
      saveMakeupToMemory();
      select.value = "";
      renderMakeupList();
      alert('✅ 已手動新增一筆需補課紀錄 (1堂)');
    }

    function renderMakeupList() {
      let activeHTML = '';
      let historyHTML = '';
      let activeCount = 0;
      let historyCount = 0;

      let reversedBank = [...makeupBank].reverse();

      reversedBank.forEach(record => {
        if (record.status === 'active') {
          activeCount++;
          
          let schList = record.schedules.map(sch => {
            let statusIcon = sch.attended ? '✅已上' : '⏳待上';
            return `<div style="font-size:12px; color:#E08E79; margin-top:5px;">↳ ${statusIcon} ${sch.date} ${formatTime24h(sch.time)} (扣 ${sch.amount} 堂)</div>`;
          }).join('');

          let formHTML = '';
          if (record.remaining > 0) {
            formHTML = `
              <div style="background-color:#f9f9f9; padding:10px; border-radius:5px; margin-top:10px;">
                <div style="display:flex; gap:10px; margin-bottom:5px;">
                  <input type="number" id="amt_${record.id}" class="form-control" style="padding:5px; width:40%;" placeholder="補幾堂 (如0.5)" step="0.1" min="0.1" max="${record.remaining}">
                  <input type="date" id="date_${record.id}" class="form-control" style="padding:5px; width:60%;">
                </div>
                <div style="display:flex; gap:10px;">
                  <input type="time" id="time_${record.id}" class="form-control" style="padding:5px; width:50%;">
                  <button class="small-btn" style="width:50%; background-color:#8C9C8A; color:white;" onclick="scheduleMakeup('${record.id}')">確定排課</button>
                </div>
              </div>
            `;
          }

          activeHTML += `
            <div class="card makeup-card">
              <div style="display:flex; justify-content:space-between;">
                <div class="student-title">${record.studentName}</div>
                <div style="font-size:12px; color:#888;">產生於: ${record.dateGen}</div>
              </div>
              <div class="student-detail" style="font-size:14px; font-weight:bold;">
                總需補: ${record.totalOwed} 堂 | <span style="color:#E08E79;">尚欠: ${record.remaining} 堂</span>
              </div>
              ${schList}
              ${formHTML}
              <button class="small-btn" style="margin-top:10px; color:#888; background:transparent; text-decoration:underline;" onclick="cancelMakeupRecord('${record.id}')">取消這筆紀錄</button>
            </div>
          `;
        } else {
          historyCount++;
          historyHTML += `
            <div class="card history-card">
              <div style="display:flex; justify-content:space-between;">
                <div class="student-title" style="color:#888;">${record.studentName}</div>
                <div style="font-size:12px; color:#aaa;">已結清</div>
              </div>
              <div class="student-detail" style="margin-bottom:0;">
                總補課: ${record.totalOwed} 堂 (產生於 ${record.dateGen})
              </div>
            </div>
          `;
        }
      });

      if(activeCount === 0) activeHTML = '<p style="color:#888;">目前沒有需要補課的學生！</p>';
      if(historyCount === 0) historyHTML = '<p style="color:#aaa; font-size:12px;">尚無歷史紀錄</p>';

      document.getElementById('makeup-active-list').innerHTML = activeHTML;
      document.getElementById('makeup-history-list').innerHTML = historyHTML;
    }

    function scheduleMakeup(recordId) {
      let record = makeupBank.find(r => r.id === recordId);
      if (!record) return;

      let amtInput = document.getElementById('amt_' + recordId).value;
      let dateInput = document.getElementById('date_' + recordId).value;
      let timeInput = document.getElementById('time_' + recordId).value;

      let amount = Number(amtInput);

      if (!amtInput || amount <= 0 || amount > record.remaining) {
        alert(`❌ 輸入數量錯誤！必須大於 0，且小於等於尚欠的 ${record.remaining} 堂`);
        return;
      }
      if (!dateInput) {
        alert('❌ 請選擇補課日期！');
        return;
      }

      record.schedules.push({
        date: dateInput,
        time: timeInput,
        amount: amount,
        attended: false
      });
      record.remaining = Number((record.remaining - amount).toFixed(2)); 

      saveMakeupToMemory();
      renderMakeupList();
      alert(`✅ 成功排定！已扣除 ${amount} 堂，自動加入 ${dateInput} 的日曆與點名表中。`);
    }

    function cancelMakeupRecord(recordId) {
      if(confirm("確定要取消這整筆補課紀錄嗎？(紀錄將會刪除)")) {
        makeupBank = makeupBank.filter(r => r.id !== recordId);
        saveMakeupToMemory();
        renderMakeupList();
      }
    }

    function toggleHistory() {
      let el = document.getElementById('makeup-history-list');
      let btn = document.getElementById('toggle-history-btn');
      if (el.style.display === 'none') {
        el.style.display = 'block';
        btn.innerText = '🔺 隱藏歷史紀錄';
      } else {
        el.style.display = 'none';
        btn.innerText = '👁️ 顯示已完成的歷史紀錄';
      }
    }
    
    function saveMakeupToMemory() { localStorage.setItem('jess_makeup_v1', JSON.stringify(makeupBank)); }
    
    function renderManageList() {
      let listHTML = '';
      for (let i = 0; i < students.length; i++) {
        let s = students[i];
        let displayTime = (s.dayIndex !== "") ? getDayName(s.dayIndex) + ' ' + formatTime24h(s.timeVal) : '未設定完整時間';
        listHTML += `<div class="card" style="display: flex; justify-content: space-between; align-items: center;"><div><div class="student-title" style="font-size: 16px;">${s.name} (${s.instrument})</div><div class="student-detail" style="margin-bottom:0;">🕒 ${displayTime} <br> 💰 ${s.fee}元 / 堂 <br> 📞 ${s.phone}</div></div><div><button class="small-btn del-btn" onclick="deleteStudent(${i})">刪除</button></div></div>`;
      }
      document.getElementById('manage-list').innerHTML = listHTML;
    }
    
    function renderSalaryPage() { document.getElementById('total-revenue').innerText = 'NT$ ' + financeData.totalRevenue.toLocaleString(); }
    
    function checkInstrument() {
      let radios = document.getElementsByName('add-instrument'); let otherInput = document.getElementById('other-instrument');
      for(let i=0; i<radios.length; i++) { if(radios[i].checked && radios[i].value === '其他') { otherInput.style.display = 'block'; otherInput.focus(); } else if (radios[i].checked && radios[i].value !== '其他') { otherInput.style.display = 'none'; } }
    }
    
    function addStudent() {
      let name = document.getElementById('add-name').value.trim(); let fee = document.getElementById('add-fee').value.trim(); let phone = document.getElementById('add-phone').value.trim(); let dayIndex = document.getElementById('add-day').value; let timeVal = document.getElementById('add-time').value;
      let instrumentRadios = document.getElementsByName('add-instrument'); let instrument = '';
      for(let i=0; i<instrumentRadios.length; i++){ if(instrumentRadios[i].checked) { instrument = (instrumentRadios[i].value === '其他') ? (document.getElementById('other-instrument').value.trim() || '未指定樂器') : instrumentRadios[i].value; } }
      if (name === '') { alert('📝 學生姓名是一定要填寫的喔！'); return; } if (dayIndex === '') { alert('📅 請記得選擇「上課星期」，這樣系統才能幫你自動排進月曆喔！'); return; } if (fee === '' || fee <= 0) { alert('💰 請記得填寫「單堂學費」，這樣點名時系統才能幫你算費用喔！'); return; }
      students.push({ name: name, instrument: instrument, dayIndex: dayIndex, timeVal: timeVal, fee: fee, phone: phone, canceledDates: [], makeupConvertedDates: [] });
      saveToMemory(); document.getElementById('add-name').value = ''; document.getElementById('add-fee').value = ''; document.getElementById('add-phone').value = ''; document.getElementById('add-day').value = ''; document.getElementById('add-time').value = '';
      document.getElementsByName('add-instrument')[0].checked = true; document.getElementById('other-instrument').style.display = 'none'; document.getElementById('other-instrument').value = ''; renderManageList(); alert('✅ 新增成功！請去月曆看看，課表已經自動排好囉！');
    }
    
    function deleteStudent(index) { if (confirm("確定要刪除這位學生的資料嗎？")) { students.splice(index, 1); saveToMemory(); renderManageList(); } }
    function saveToMemory() { localStorage.setItem('jess_students_v3', JSON.stringify(students)); }
    function saveFinanceToMemory() { localStorage.setItem('jess_finance_v2', JSON.stringify(financeData)); }
    function resetSalary() { if(confirm("⚠️ 確定要將本月的費用總額「歸零」嗎？\n通常在月底結算後才執行此動作喔！")) { financeData.totalRevenue = 0; saveFinanceToMemory(); renderSalaryPage(); alert("資料已歸零，下個月重新開始計算！"); } }
  </script>
</body>
</html>
