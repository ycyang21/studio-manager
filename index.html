<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jess Music Studio 管理系統</title>
  
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
  
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; text-align: center; padding: 15px; background-color: #FDFBF7; color: #4A4A4A; }
    h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; }
    p { font-size: 14px; color: #888; margin-bottom: 30px; }
    
    .button { display: block; width: 90%; padding: 15px; margin: 15px auto; background-color: #8C9C8A; color: white; text-decoration: none; border-radius: 8px; font-size: 16px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
    .btn-secondary { background-color: #D3D3D3; color: #333; }
    .small-btn { padding: 5px 10px; border: none; border-radius: 5px; font-size: 14px; margin-left: 5px; cursor: pointer; }
    .del-btn { background-color: #FFB6B9; color: white; }
    .reset-btn { background-color: #E2E8DF; color: #333; width: 100%; padding: 10px; margin-top: 15px; border-radius: 5px; border: none; cursor: pointer; }
    
    .card { background-color: white; padding: 15px; margin: 10px auto; width: 90%; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; }
    .makeup-card { border-left: 4px solid #E08E79; } 
    .history-card { border-left: 4px solid #ccc; opacity: 0.7; }
    
    .student-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #333; }
    .student-detail { font-size: 13px; color: #666; margin-bottom: 12px; }
    
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: bold; }
    .form-control, .form-select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; background-color: white;} 
    .radio-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; align-items: center; }
    
    /* 讓星期與時間完美並排在同一個整合式 Bar 內 */
    .time-bar { display: flex; gap: 5px; align-items: center; background: white; border: 1px solid #ccc; border-radius: 5px; padding: 3px 8px; }
    .time-bar select { border: none; background: transparent; font-size: 16px; padding: 6px; outline: none; }

    #calendar { margin-top: 15px; font-size: 14px; background-color: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .fc-toolbar-title { font-size: 18px !important; color: #4A4A4A; }
    .fc-button { background-color: #8C9C8A !important; border: none !important; }
    .fc-event { border: none !important; padding: 4px 6px; border-radius: 4px; font-size: 13px; margin-bottom: 3px; cursor: pointer; }
    
    .event-piano { background-color: #8C9C8A !important; color: white !important; }
    .event-violin { background-color: #B5A886 !important; color: white !important; }
    .event-other { background-color: #A39193 !important; color: white !important; }
    .event-makeup { background-color: #E08E79 !important; color: white !important; } 
    
    .event-attended { background-color: #5d705b !important; color: white !important; border-left: 4px solid #333 !important;}
    .event-canceled { background-color: #f0f0f0 !important; color: #aaa !important; text-decoration: line-through !important; opacity: 0.6; }
    .event-makeup-conv { background-color: #FFF9F5 !important; color: #E08E79 !important; border: 1px dashed #E08E79 !important; opacity: 0.8; }
    
    .money-box { background-color: white; border-left: 5px solid #8C9C8A; padding: 15px; margin-bottom: 15px; border-radius: 0 8px 8px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left;}
    .money-title { font-size: 14px; color: #666; margin-bottom: 5px; }
    .money-amount { font-size: 28px; font-weight: bold; color: #333; }
    
    #attendance-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; }
    .modal-content { background: white; width: 85%; max-width: 350px; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    .modal-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; font-size: 16px; color: white; cursor: pointer; }
  </style>
</head>
<body>
  
  <div id="main-menu">
    <h1>Jess Music Studio</h1>
    <p>工作室管理系統</p>
    <button class="button" onclick="showPage('calendar-page')">📅 月曆與點名簿</button>
    <button class="button" onclick="showPage('makeup-page')">🔄 補課存摺管理</button>
    <button class="button" onclick="showPage('manage-page')">⚙️ 學生名單管理</button>
    <button class="button" onclick="showPage('salary-page')">💰 每月學費自動結算</button>
  </div>

  <div id="calendar-page" style="display: none;">
    <h2 style="font-weight: 300;">📅 點擊課表即可點名</h2>
    <div id="calendar"></div>
    <button class="button btn-secondary" style="margin-top: 20px;" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <div id="attendance-modal">
    <div class="modal-content">
      <h3 id="modal-title" style="margin-top: 0; font-size: 20px; color: #333;">學生姓名</h3>
      <p id="modal-date" style="color: #666; font-size: 14px; margin-bottom: 20px;">2026-09-11 18:00</p>
      
      <div id="modal-normal-actions">
        <button class="modal-btn" style="background-color: #8C9C8A;" onclick="markStatus('attended')">✅ 出席 (紀錄學費)</button>
        <button class="modal-btn" style="background-color: #E2E8DF; color: #333;" onclick="markStatus('canceled')">❌ 延期 (不收費/留存紀錄)</button>
        <button class="modal-btn" style="background-color: #E08E79;" onclick="markStatus('makeup')">🔄 轉為補課 (存入存摺)</button>
        <button class="modal-btn" style="background-color: #fff; color: #888; border: 1px solid #ddd;" onclick="markStatus('reset')">↩️ 恢復為「未點名」</button>
      </div>

      <div id="modal-makeup-actions" style="display: none;">
        <div id="modal-makeup-pending">
          <button class="modal-btn" style="background-color: #8C9C8A;" onclick="markMakeupStatus('attended')">✅ 補課出席 (紀錄學費)</button>
          <button class="modal-btn" style="background-color: #FFB6B9;" onclick="markMakeupStatus('canceled')">❌ 取消排課 (退回存摺)</button>
        </div>
        <div id="modal-makeup-done" style="display: none;">
          <p style="font-size:13px; color:#888; margin-bottom:15px;">✅ 這堂補課已完成並計入學費，如需更正請先恢復狀態。</p>
          <button class="modal-btn" style="background-color: #E2E8DF; color:#333;" onclick="markMakeupStatus('revert')">↩️ 恢復為「尚未出席」</button>
        </div>
      </div>
      <button class="button btn-secondary" style="margin-top: 25px; padding: 10px;" onclick="closeModal()">取消關閉</button>
    </div>
  </div>

  <div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center;">
    <div class="modal-content" style="text-align: left; max-height: 85vh; overflow-y: auto;">
      <h3 style="margin-top: 0; font-size: 18px; color: #333; text-align:center;">✏️ 編輯學生資料</h3>
      <div class="form-group"><label>學生姓名</label><input type="text" id="edit-name" class="form-control"></div>
      <div class="form-group"><label>學習樂器</label><div class="radio-group">
        <label><input type="radio" name="edit-instrument" value="鋼琴" onclick="checkEditInstrument()"> 鋼琴</label>
        <label><input type="radio" name="edit-instrument" value="小提琴" onclick="checkEditInstrument()"> 小提琴</label>
        <label><input type="radio" name="edit-instrument" value="其他" onclick="checkEditInstrument()"> 其他</label>
        <input type="text" id="edit-other-instrument" class="form-control" style="display: none; width: auto; flex-grow: 1; padding: 5px;" placeholder="請輸入樂器">
      </div></div>
      <div class="form-group">
        <label>上課時間 (24小時制)</label>
        <div class="time-bar">
          <select id="edit-day" style="flex: 1.2; border-right: 1px solid #ddd;">
            <option value="1">週一</option><option value="2">週二</option><option value="3">週三</option>
            <option value="4">週四</option><option value="5">週五</option><option value="6">週六</option><option value="0">週日</option>
          </select>
          <select id="edit-time" style="flex: 1.3; text-align: center;"></select>
        </div>
      </div>
      <div class="form-group"><label>單堂學費 (元)</label><input type="number" id="edit-fee" class="form-control"></div>
      <div class="form-group"><label>聯絡電話</label><input type="tel" id="edit-phone" class="form-control"></div>
      <button class="button" style="width:100%; margin:10px 0 0 0;" onclick="saveEditedStudent()">💾 儲存修改</button>
      <button class="button btn-secondary" style="width:100%; margin:10px 0 0 0;" onclick="closeEditModal()">取消</button>
    </div>
  </div>

  <div id="makeup-page" style="display: none;">
    <h2 style="font-weight: 300;">🔄 補課存摺管理</h2>
    <div class="card" style="background-color: #FFF9F5; border: 1px solid #E08E79;">
      <h3 style="margin-top:0; font-size: 16px; color:#E08E79;">➕ 手動新增 (先補課/請假)</h3>
      <div class="form-group">
        <select id="manual-makeup-student" class="form-select"><option value="" disabled selected>選擇學生</option></select>
      </div>
      <button class="button" style="width:100%; margin:0; background-color:#E08E79;" onclick="addManualMakeup()">新增 1 堂需補課紀錄</button>
    </div>
    <h3 style="font-size: 16px; text-align: left; padding-left: 20px; margin-top: 20px;">📝 待處理補課</h3>
    <div id="makeup-active-list"></div>
    <button class="reset-btn" id="toggle-history-btn" onclick="toggleHistory()" style="width: 90%; margin: 20px auto; display: block;">👁️ 顯示已完成的歷史紀錄</button>
    <div id="makeup-history-list" style="display: none;"></div>
    <button class="button btn-secondary" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <div id="manage-page" style="display: none;">
    <h2 style="font-weight: 300;">⚙️ 學生名單管理</h2>
    <div class="card" style="background-color: #F4F6F3; border: 1px solid #8C9C8A;">
      <h3 style="margin-top:0; font-size: 16px;">➕ 新增學生資料</h3>
      <div class="form-group"><label>學生姓名</label><input type="text" id="add-name" class="form-control" placeholder="例如：王大花"></div>
      <div class="form-group"><label>學習樂器</label><div class="radio-group"><label><input type="radio" name="add-instrument" value="鋼琴" onclick="checkInstrument()" checked> 鋼琴</label><label><input type="radio" name="add-instrument" value="小提琴" onclick="checkInstrument()"> 小提琴</label><label><input type="radio" name="add-instrument" value="其他" onclick="checkInstrument()"> 其他</label><input type="text" id="other-instrument" class="form-control" style="display: none; width: auto; flex-grow: 1; padding: 5px;" placeholder="請輸入樂器"></div></div>
      
      <!-- 整合在同一個美觀 Bar 內的 24 小時制選擇 -->
      <div class="form-group">
        <label>上課時間 (必填)</label>
        <div class="time-bar">
          <select id="add-day" style="flex: 1.2; border-right: 1px solid #ddd;">
            <option value="" disabled selected>選擇星期</option>
            <option value="1">週一</option><option value="2">週二</option><option value="3">週三</option>
            <option value="4">週四</option><option value="5">週五</option><option value="6">週六</option><option value="0">週日</option>
          </select>
          <select id="add-time" style="flex: 1.3; text-align: center;">
            <option value="" disabled selected>選擇時間</option>
          </select>
        </div>
      </div>
      
      <div class="form-group"><label>單堂學費 (元)</label><input type="number" id="add-fee" class="form-control" placeholder="例如：1000"></div>
      <div class="form-group"><label>聯絡電話</label><input type="tel" id="add-phone" class="form-control" placeholder="家長或學生電話"></div>
      <button class="button" style="width:100%; margin:0;" onclick="addStudent()">確認新增</button>
    </div>
    <div id="manage-list"></div>
    <button class="button btn-secondary" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <div id="salary-page" style="display: none;">
    <h2 style="font-weight: 300;">💰 自動結算系統</h2>
    <div style="width: 90%; margin: 0 auto;">
      <div class="form-group">
        <label>選擇結算月份</label>
        <input type="month" id="salary-month-picker" class="form-control" onchange="calculateDynamicRevenue()">
      </div>
      <div class="money-box" style="margin-top: 20px;">
        <div class="money-title">本月「已出席」學費總額</div>
        <div class="money-amount" id="dynamic-total-revenue">NT$ 0</div>
      </div>
      <p style="font-size:12px; color:#888; text-align:left; line-height:1.5;">💡 系統會自動掃描月曆上所有打勾 ✅ 出席的紀錄來計算。若金額有誤，請直接至月曆修改該堂課的出缺席狀態即可。</p>
    </div>
    <button class="button btn-secondary" style="margin-top: 20px;" onclick="showPage('main-menu')">返回主選單</button>
  </div>

  <script>
    let students = JSON.parse(localStorage.getItem('jess_students_v4')) || [];
    let makeupBank = JSON.parse(localStorage.getItem('jess_makeup_v2')) || [];
    let calendar; 
    let currentModalEvent = null; 
    let editingIndex = null; // 目前正在編輯的學生索引（null = 沒有開啟編輯視窗）

    // 資料遷移：確保每位學生都有唯一 id，補課存摺改用 id 對應學生（避免同名學生互相干擾、改名後也不會對不到人）
    (function migrateData() {
      let changed = false;
      students.forEach(s => { if (!s.id) { s.id = generateId(); changed = true; } });
      if (changed) saveToMemory();

      let makeupChanged = false;
      makeupBank.forEach(r => {
        if (!r.studentId) {
          let match = students.find(s => s.name === r.studentName);
          r.studentId = match ? match.id : null;
          makeupChanged = true;
        }
      });
      if (makeupChanged) saveMakeupToMemory();
    })();

    // 共用的 24 小時制時間選單（時+分合併成單一下拉選單，一次點選即可），新增表單與編輯表單都會用到
    function timeOptionsHTML(includePlaceholder) {
      let html = includePlaceholder ? '<option value="" disabled selected>選擇時間</option>' : '';
      for (let h = 0; h < 24; h++) {
        for (let m = 0; m < 60; m += 5) { //以 5 分鐘為單位，兼顧彈性與整潔
          let val = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
          html += `<option value="${val}">${val}</option>`;
        }
      }
      return html;
    }

    // 初始化「新增學生」表單的 24 小時制時間選單選項
    window.onload = function() {
      document.getElementById('add-time').innerHTML = timeOptionsHTML(true);
    };

    function formatDate(dateObj) {
      let y = dateObj.getFullYear();
      let m = String(dateObj.getMonth() + 1).padStart(2, '0');
      let d = String(dateObj.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }
    
    function generateId() { return Math.random().toString(36).substr(2, 9); }

    function showPage(pageId) {
      const pages = ['main-menu', 'calendar-page', 'manage-page', 'salary-page', 'makeup-page'];
      pages.forEach(p => document.getElementById(p).style.display = 'none');
      
      if(pageId === 'manage-page') renderManageList();
      if(pageId === 'salary-page') {
        let now = new Date();
        document.getElementById('salary-month-picker').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        calculateDynamicRevenue();
      }
      if(pageId === 'makeup-page') { populateMakeupStudentSelect(); renderMakeupList(); }
      
      document.getElementById(pageId).style.display = 'block';
      
      if(pageId === 'calendar-page') { renderCalendar(); }
    }

    function renderCalendar() {
      if (!calendar) {
        let calendarEl = document.getElementById('calendar');
        calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth', locale: 'zh-tw',
          headerToolbar: { left: 'prev,next', center: 'title', right: 'today' },
          height: 'auto', displayEventTime: true,
          eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
          events: function(info, successCallback, failureCallback) {
            let events = [];
            let d = new Date(info.start.valueOf());
            
            while(d < info.end) {
              let dayOfWeek = d.getDay().toString();
              let dateStr = formatDate(d);

              students.forEach((s, stuIdx) => {
                if (s.dayIndex === dayOfWeek) {
                  let attended = s.attendedDates || [];
                  let canceled = s.canceledDates || [];
                  let makeupConverted = s.makeupConvertedDates || [];
                  
                  let eventClass = s.instrument === '鋼琴' ? 'event-piano' : (s.instrument === '小提琴' ? 'event-violin' : 'event-other');
                  let displayTitle = s.name + ' (' + s.instrument + ')';

                  if (attended.includes(dateStr)) {
                    eventClass = 'event-attended'; displayTitle = '✅ ' + s.name;
                  } else if (canceled.includes(dateStr)) {
                    eventClass = 'event-canceled'; displayTitle = '❌ ' + s.name + ' (延期)';
                  } else if (makeupConverted.includes(dateStr)) {
                    eventClass = 'event-makeup-conv'; displayTitle = '🔄 ' + s.name + ' (轉補)';
                  }

                  events.push({
                    title: displayTitle,
                    className: eventClass,
                    start: dateStr + (s.timeVal ? 'T' + s.timeVal : ''),
                    allDay: !s.timeVal,
                    extendedProps: { type: 'normal', stuIdx: stuIdx, dateStr: dateStr }
                  });
                }
              });

              makeupBank.forEach(record => {
                if(record.status === 'active') {
                  record.schedules.forEach((sch, schIdx) => {
                    if (sch.date === dateStr) {
                      let displayTitle = '[補課] ' + record.studentName;
                      let eventClass = 'event-makeup';
                      if (sch.attended) { displayTitle = '✅ [補] ' + record.studentName; eventClass = 'event-attended'; }

                      events.push({
                        title: displayTitle,
                        className: eventClass,
                        start: dateStr + (sch.time ? 'T' + sch.time : ''),
                        extendedProps: { type: 'makeup', recordId: record.id, schIdx: schIdx, dateStr: dateStr }
                      });
                    }
                  });
                }
              });

              d.setDate(d.getDate() + 1);
            }
            successCallback(events);
          },
          eventClick: function(info) {
            let props = info.event.extendedProps;
            currentModalEvent = props;
            
            let cleanTitle = info.event.title.replace(/✅ |❌ |🔄 |\[補課\] |\[補\] /g, '').replace(/\s*\(延期\)|\s*\(轉補\)/g, '');
            document.getElementById('modal-title').innerText = cleanTitle;
            
            let timeStr = info.event.start.toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit', hour12: false});
            document.getElementById('modal-date').innerText = props.dateStr + (info.event.allDay ? '' : ' ' + timeStr);

            if (props.type === 'normal') {
              document.getElementById('modal-normal-actions').style.display = 'block';
              document.getElementById('modal-makeup-actions').style.display = 'none';
            } else {
              document.getElementById('modal-normal-actions').style.display = 'none';
              document.getElementById('modal-makeup-actions').style.display = 'block';

              let record = makeupBank.find(r => r.id === props.recordId);
              let sch = record ? record.schedules[props.schIdx] : null;
              let isDone = !!(sch && sch.attended);
              document.getElementById('modal-makeup-pending').style.display = isDone ? 'none' : 'block';
              document.getElementById('modal-makeup-done').style.display = isDone ? 'block' : 'none';
            }
            document.getElementById('attendance-modal').style.display = 'flex';
          }
        });
        calendar.render();
      } else {
        calendar.refetchEvents();
      }
      setTimeout(() => { calendar.updateSize(); }, 100);
    }

    function closeModal() { document.getElementById('attendance-modal').style.display = 'none'; }

    function markStatus(status) {
      let stuIdx = currentModalEvent.stuIdx;
      let dateStr = currentModalEvent.dateStr;
      let s = students[stuIdx];
      
      if(!s.attendedDates) s.attendedDates = [];
      if(!s.canceledDates) s.canceledDates = [];
      if(!s.makeupConvertedDates) s.makeupConvertedDates = [];

      if (s.makeupConvertedDates.includes(dateStr)) {
         let relatedRecord = makeupBank.find(r => r.studentId === s.id && r.dateGen === dateStr);
         if (relatedRecord && (relatedRecord.schedules.length > 0 || relatedRecord.status === 'history')) {
           if (!confirm('⚠️ 這筆補課紀錄已經有排課或已完成的紀錄，變更狀態將會一併刪除這些補課安排（包含已計入學費的紀錄），確定要繼續嗎？')) { return; }
         }
         makeupBank = makeupBank.filter(r => !(r.studentId === s.id && r.dateGen === dateStr));
         saveMakeupToMemory();
      }

      s.attendedDates = s.attendedDates.filter(d => d !== dateStr);
      s.canceledDates = s.canceledDates.filter(d => d !== dateStr);
      s.makeupConvertedDates = s.makeupConvertedDates.filter(d => d !== dateStr);

      if (status === 'attended') s.attendedDates.push(dateStr);
      if (status === 'canceled') s.canceledDates.push(dateStr);
      if (status === 'makeup') {
        s.makeupConvertedDates.push(dateStr);
        makeupBank.push({
          id: generateId(), studentId: s.id, studentName: s.name, dateGen: dateStr,
          totalOwed: 1, remaining: 1, status: 'active', schedules: []
        });
        saveMakeupToMemory();
      }
      saveToMemory(); calendar.refetchEvents(); closeModal();
    }

    function markMakeupStatus(status) {
      let recordId = currentModalEvent.recordId;
      let schIdx = currentModalEvent.schIdx;
      let record = makeupBank.find(r => r.id === recordId);
      
      if (record) {
        let sch = record.schedules[schIdx];
        if (status === 'attended') {
          sch.attended = true;
          if (record.remaining === 0 && record.schedules.every(s => s.attended)) { record.status = 'history'; }
        } else if (status === 'revert') {
          sch.attended = false;
          record.status = 'active';
        } else if (status === 'canceled') {
          if(confirm("確定要取消這堂補課嗎？時數將退回給學生。")) {
            record.remaining = Number((record.remaining + sch.amount).toFixed(2));
            record.schedules.splice(schIdx, 1);
            record.status = 'active'; 
          } else { return; }
        }
        saveMakeupToMemory(); calendar.refetchEvents();
      }
      closeModal();
    }

    function calculateDynamicRevenue() {
      let monthStr = document.getElementById('salary-month-picker').value; 
      if (!monthStr) return;
      let total = 0;

      students.forEach(s => {
        let fee = Number(s.fee) || 0;
        let attended = s.attendedDates || [];
        attended.forEach(d => { if (d.startsWith(monthStr)) total += fee; });
      });

      makeupBank.forEach(record => {
        let stuData = students.find(s => s.id === record.studentId) || students.find(s => s.name === record.studentName);
        let fee = stuData ? (Number(stuData.fee) || 0) : 0;
        record.schedules.forEach(sch => {
          if (sch.attended && sch.date.startsWith(monthStr)) { total += (fee * sch.amount); }
        });
      });
      document.getElementById('dynamic-total-revenue').innerText = 'NT$ ' + total.toLocaleString();
    }

    function populateMakeupStudentSelect() {
      let select = document.getElementById('manual-makeup-student');
      select.innerHTML = '<option value="" disabled selected>選擇學生</option>';
      students.forEach(s => { select.innerHTML += `<option value="${s.id}">${s.name}</option>`; });
    }

    function addManualMakeup() {
      let select = document.getElementById('manual-makeup-student');
      let studentId = select.value;
      if (!studentId) { alert('請先選擇學生！'); return; }
      let stu = students.find(s => s.id === studentId);
      if (!stu) { alert('找不到這位學生，請重新整理頁面再試一次！'); return; }
      
      makeupBank.push({ id: generateId(), studentId: stu.id, studentName: stu.name, dateGen: formatDate(new Date()), totalOwed: 1, remaining: 1, status: 'active', schedules: [] });
      saveMakeupToMemory(); select.value = ""; renderMakeupList(); alert('✅ 已手動新增一筆需補課紀錄 (1堂)');
    }

    function renderMakeupList() {
      let activeHTML = ''; let historyHTML = ''; let activeCount = 0; let historyCount = 0;
      let reversedBank = [...makeupBank].reverse();

      reversedBank.forEach(record => {
        if (record.status === 'active') {
          activeCount++;
          let schList = record.schedules.map(sch => {
            let statusIcon = sch.attended ? '✅已上' : '⏳待上';
            return `<div style="font-size:12px; color:#E08E79; margin-top:5px;">↳ ${statusIcon} ${sch.date} ${sch.time} (扣 ${sch.amount} 堂)</div>`;
          }).join('');

          let formHTML = '';
          if (record.remaining > 0) {
            formHTML = `
              <div style="background-color:#f9f9f9; padding:10px; border-radius:5px; margin-top:10px;">
                <div style="display:flex; gap:10px; margin-bottom:5px;">
                  <input type="number" id="amt_${record.id}" class="form-control" style="padding:5px; width:40%;" placeholder="補幾堂 (如0.5)" step="0.1" min="0.1" max="${record.remaining}">
                  <input type="date" id="date_${record.id}" class="form-control" style="padding:5px; width:60%;">
                </div>
                <div style="display:flex; gap:5px; align-items:center; background:white; border:1px solid #ccc; border-radius:5px; padding:3px 8px; margin-top:5px;">
                  <select id="time_${record.id}" style="flex:1; border:none; background:transparent; font-size:14px; padding:4px; outline:none;">${timeOptionsHTML(true)}</select>
                  <button class="small-btn" style="padding: 6px 12px; background-color:#8C9C8A; color:white;" onclick="scheduleMakeup('${record.id}')">確定排課</button>
                </div>
              </div>`;
          }
          activeHTML += `<div class="card makeup-card"><div style="display:flex; justify-content:space-between;"><div class="student-title">${record.studentName}</div><div style="font-size:12px; color:#888;">產生於: ${record.dateGen}</div></div><div class="student-detail" style="font-size:14px; font-weight:bold;">總需補: ${record.totalOwed} 堂 | <span style="color:#E08E79;">尚欠: ${record.remaining} 堂</span></div>${schList}${formHTML}<button class="small-btn" style="margin-top:10px; color:#888; background:transparent; text-decoration:underline;" onclick="cancelMakeupRecord('${record.id}')">取消這筆紀錄</button></div>`;
        } else {
          historyCount++;
          historyHTML += `<div class="card history-card"><div style="display:flex; justify-content:space-between;"><div class="student-title" style="color:#888;">${record.studentName}</div><div style="font-size:12px; color:#aaa;">已結清</div></div><div class="student-detail" style="margin-bottom:0;">總補課: ${record.totalOwed} 堂 (產生於 ${record.dateGen})</div></div>`;
        }
      });
      document.getElementById('makeup-active-list').innerHTML = activeCount === 0 ? '<p style="color:#888;">目前沒有需要補課的學生！</p>' : activeHTML;
      document.getElementById('makeup-history-list').innerHTML = historyCount === 0 ? '<p style="color:#aaa; font-size:12px;">尚無歷史紀錄</p>' : historyHTML;
    }

    function scheduleMakeup(recordId) {
      let record = makeupBank.find(r => r.id === recordId);
      let amt = Number(document.getElementById('amt_' + recordId).value);
      let date = document.getElementById('date_' + recordId).value;
      let timeInput = document.getElementById('time_' + recordId).value;
      
      if (!amt || amt <= 0 || amt > record.remaining) { alert(`❌ 輸入錯誤！最多只能補 ${record.remaining} 堂`); return; }
      if (!date || !timeInput) { alert('❌ 請完整選擇補課的日期與時間！'); return; }

      record.schedules.push({ date: date, time: timeInput, amount: amt, attended: false });
      record.remaining = Number((record.remaining - amt).toFixed(2)); 
      saveMakeupToMemory(); renderMakeupList(); alert(`✅ 排定成功！`);
    }

    function cancelMakeupRecord(recordId) {
      if(confirm("確定刪除嗎？")) { makeupBank = makeupBank.filter(r => r.id !== recordId); saveMakeupToMemory(); renderMakeupList(); }
    }

    function toggleHistory() {
      let el = document.getElementById('makeup-history-list'); let btn = document.getElementById('toggle-history-btn');
      if (el.style.display === 'none') { el.style.display = 'block'; btn.innerText = '🔺 隱藏歷史紀錄'; } else { el.style.display = 'none'; btn.innerText = '👁️ 顯示已完成的歷史紀錄'; }
    }
    
    function saveMakeupToMemory() { localStorage.setItem('jess_makeup_v2', JSON.stringify(makeupBank)); }
    function getDayName(index) {
      const days = {'0':'週日', '1':'週一', '2':'週二', '3':'週三', '4':'週四', '5':'週五', '6':'週六'};
      return days[index] || '';
    }

    function renderManageList() {
      let listHTML = '';
      students.forEach((s, i) => {
        let displayTime = (s.dayIndex !== "") ? getDayName(s.dayIndex) + ' ' + s.timeVal : '未設定完整時間';
        listHTML += `<div class="card" style="display: flex; justify-content: space-between; align-items: center;"><div><div class="student-title" style="font-size: 16px;">${s.name} (${s.instrument})</div><div class="student-detail" style="margin-bottom:0;">🕒 ${displayTime} <br> 💰 ${s.fee}元 / 堂 <br> 📞 ${s.phone}</div></div><div style="white-space:nowrap;"><button class="small-btn" style="background-color:#E2E8DF; color:#333;" onclick="openEditModal(${i})">編輯</button><button class="small-btn del-btn" onclick="deleteStudent(${i})">刪除</button></div></div>`;
      });
      document.getElementById('manage-list').innerHTML = listHTML;
    }
    
    function checkInstrument() {
      let radios = document.getElementsByName('add-instrument'); let otherInput = document.getElementById('other-instrument');
      radios.forEach(r => { if(r.checked && r.value === '其他') { otherInput.style.display = 'block'; otherInput.focus(); } else if (r.checked && r.value !== '其他') { otherInput.style.display = 'none'; } });
    }

    function checkEditInstrument() {
      let radios = document.getElementsByName('edit-instrument'); let otherInput = document.getElementById('edit-other-instrument');
      radios.forEach(r => { if(r.checked && r.value === '其他') { otherInput.style.display = 'block'; otherInput.focus(); } else if (r.checked && r.value !== '其他') { otherInput.style.display = 'none'; } });
    }

    function openEditModal(index) {
      editingIndex = index;
      let s = students[index];
      document.getElementById('edit-name').value = s.name;

      let radios = document.getElementsByName('edit-instrument');
      let isKnownInstrument = (s.instrument === '鋼琴' || s.instrument === '小提琴');
      radios.forEach(r => { r.checked = isKnownInstrument ? (r.value === s.instrument) : (r.value === '其他'); });
      document.getElementById('edit-other-instrument').style.display = isKnownInstrument ? 'none' : 'block';
      document.getElementById('edit-other-instrument').value = isKnownInstrument ? '' : s.instrument;

      document.getElementById('edit-time').innerHTML = timeOptionsHTML(false);
      document.getElementById('edit-day').value = s.dayIndex;
      document.getElementById('edit-time').value = s.timeVal || '00:00';

      document.getElementById('edit-fee').value = s.fee;
      document.getElementById('edit-phone').value = s.phone;

      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; editingIndex = null; }

    function saveEditedStudent() {
      if (editingIndex === null) return;
      let name = document.getElementById('edit-name').value.trim();
      let fee = document.getElementById('edit-fee').value.trim();
      let phone = document.getElementById('edit-phone').value.trim();
      let dayIndex = document.getElementById('edit-day').value;
      let timeVal = document.getElementById('edit-time').value;

      let instrumentRadios = document.getElementsByName('edit-instrument'); let instrument = '';
      instrumentRadios.forEach(r => { if(r.checked) instrument = (r.value === '其他') ? (document.getElementById('edit-other-instrument').value.trim() || '未指定') : r.value; });

      if (name === '' || dayIndex === '' || fee === '' || isNaN(Number(fee)) || Number(fee) <= 0 || !timeVal) { alert('請填寫完整姓名、上課星期、24小時制時間，並填入大於 0 的單堂學費！'); return; }

      let s = students[editingIndex];
      s.name = name; s.instrument = instrument; s.dayIndex = dayIndex; s.timeVal = timeVal; s.fee = fee; s.phone = phone;

      // 若學生姓名有異動，同步更新補課存摺上顯示的姓名
      makeupBank.forEach(r => { if (r.studentId === s.id) r.studentName = s.name; });

      saveToMemory(); saveMakeupToMemory();
      closeEditModal();
      renderManageList();
      if (calendar) calendar.refetchEvents();
      alert('✅ 已更新學生資料！');
    }
    
    function addStudent() {
      let name = document.getElementById('add-name').value.trim(); 
      let fee = document.getElementById('add-fee').value.trim(); 
      let phone = document.getElementById('add-phone').value.trim(); 
      let dayIndex = document.getElementById('add-day').value; 
      
      let timeVal = document.getElementById('add-time').value;
      
      let instrumentRadios = document.getElementsByName('add-instrument'); let instrument = '';
      instrumentRadios.forEach(r => { if(r.checked) instrument = (r.value === '其他') ? (document.getElementById('other-instrument').value.trim() || '未指定') : r.value; });
      
      if (name === '' || dayIndex === '' || fee === '' || isNaN(Number(fee)) || Number(fee) <= 0 || !timeVal) { alert('請填寫完整姓名、上課星期、24小時制時間，並填入大於 0 的單堂學費！'); return; }
      
      students.push({ id: generateId(), name: name, instrument: instrument, dayIndex: dayIndex, timeVal: timeVal, fee: fee, phone: phone, attendedDates: [], canceledDates: [], makeupConvertedDates: [] });
      saveToMemory(); 
      
      document.getElementById('add-name').value = ''; document.getElementById('add-fee').value = ''; document.getElementById('add-phone').value = ''; document.getElementById('add-day').value = ''; 
      document.getElementById('add-time').value = '';
      document.getElementsByName('add-instrument')[0].checked = true; document.getElementById('other-instrument').style.display = 'none'; document.getElementById('other-instrument').value = ''; 
      renderManageList(); alert('✅ 新增成功！');
    }
    
    function deleteStudent(index) {
      let s = students[index];
      let relatedRecords = makeupBank.filter(r => r.studentId === s.id);
      let warnMsg = '確定要刪除「' + s.name + '」的資料嗎？此動作無法復原。';
      if (relatedRecords.length > 0) {
        warnMsg += '\n\n⚠️ 這位學生還有 ' + relatedRecords.length + ' 筆補課存摺紀錄，一併刪除後，相關的補課排課與已計入的學費金額都會一起消失。';
      }
      if (confirm(warnMsg)) {
        makeupBank = makeupBank.filter(r => r.studentId !== s.id);
        saveMakeupToMemory();
        students.splice(index, 1);
        saveToMemory();
        renderManageList();
      }
    }
    function saveToMemory() { localStorage.setItem('jess_students_v4', JSON.stringify(students)); }
  </script>
</body>
</html>
