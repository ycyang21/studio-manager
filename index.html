<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- 這一行是讓手機版完美顯示的關鍵，沒有它字會變超小 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jess Music Studio 管理系統</title>
  <style>
    /* 這裡是 CSS，負責管理「外觀與美感」 */
    body { 
      font-family: "Helvetica Neue", Arial, sans-serif; 
      text-align: center; 
      padding: 20px; 
      background-color: #FDFBF7; /* 文青感的米白色背景 */
      color: #4A4A4A;
    }
    h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; }
    p { font-size: 14px; color: #888; margin-bottom: 30px; }
    
    .button {
      display: block; 
      width: 90%; 
      padding: 15px; 
      margin: 15px auto;
      background-color: #8C9C8A; /* 帶有質感的莫蘭迪綠 */
      color: white; 
      text-decoration: none;
      border-radius: 8px; 
      font-size: 16px; 
      letter-spacing: 1px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <!-- 這裡是 HTML，負責管理「內容與文字」 -->
  <h1>Jess Music Studio</h1>
  <p>工作室管理系統</p>

  <a href="#" class="button">📝 學生點名與排課 (鋼琴/小提琴)</a>
  <a href="#" class="button">💰 師資鐘點費計算 (7成拆帳)</a>
  <a href="#" class="button">📊 本月營收統計</a>
</body>
</html>
